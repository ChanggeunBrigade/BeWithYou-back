services:
  fluent:
    image: fluent/fluent-bit:2.1.4
    volumes:
      - ./fluentbit/:/fluent-bit/etc/
    ports:
      # 센서 수집기는 같은 라즈베리파이에서만 보낸다
      - "127.0.0.1:30000:30000"
    env_file: .env
    environment:
      # 컨테이너 안에서는 compose 네트워크의 postgres 서비스로 접속한다
      - PSQL_HOST=postgres
      - PSQL_PORT=5432
    restart: always
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    volumes:
      - ./db:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      # 로컬 + Tailscale 주소에만 공개 (학습용 PC는 Tailscale로 접속)
      - "127.0.0.1:5432:5432"
      - "${TAILSCALE_IP:?.env에 TAILSCALE_IP를 설정하세요}:5432:5432"
    environment:
      - POSTGRES_DB=data
      - POSTGRES_USER=${PSQL_USER}
      - POSTGRES_PASSWORD=${PSQL_PASS}
      # pgsql 출력의 time 컬럼이 이 시간대로 저장된다 (settings.DB_TIMEZONE과 같아야 함)
      - TZ=${DB_TIMEZONE:-Asia/Seoul}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d data"]
      interval: 5s
      retries: 30
    restart: always

  mosquitto:
    image: eclipse-mosquitto:2.0
    volumes:
      - "./mosquitto.conf:/mosquitto/config/mosquitto.conf"
    ports:
      - "127.0.0.1:1883:1883"
      - "${TAILSCALE_IP:?.env에 TAILSCALE_IP를 설정하세요}:1883:1883"
    restart: always

  # ZooKeeper 없이 KRaft 모드로 동작하는 단일 노드 Kafka
  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "127.0.0.1:9092:9092"
      - "${TAILSCALE_IP:?.env에 TAILSCALE_IP를 설정하세요}:9092:9094"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      # INTERNAL: compose 내부(fluent-bit)
      # LOCAL: 라즈베리파이의 파이썬 프로세스(alerter.py) → localhost:9092
      # TAILNET: Tailscale로 접속하는 다른 PC → <TAILSCALE_IP>:9092
      - KAFKA_LISTENERS=INTERNAL://:29092,LOCAL://:9092,TAILNET://:9094,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka:29092,LOCAL://localhost:9092,TAILNET://${TAILSCALE_IP}:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:PLAINTEXT,LOCAL:PLAINTEXT,TAILNET:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_LOG_RETENTION_HOURS=24
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null"]
      interval: 10s
      timeout: 20s
      retries: 30
    restart: always
