[SERVICE]
    # 실시간 추론 지연을 줄이기 위해 0.2초마다 내보낸다
    Flush     0.2
    Log_Level info

[INPUT]
    Name   forward
    Listen 0.0.0.0
    Port   30000

# 실시간 추론(alerter.py)용 스트림
[OUTPUT]
    Name          kafka
    Match         audio.data
    Brokers       kafka:29092
    Topics        audio.data
    Timestamp_Key ts

[OUTPUT]
    Name          kafka
    Match         tcpdump.data
    Brokers       kafka:29092
    Topics        tcpdump.data
    Timestamp_Key ts

# 학습/라벨링(dataload.py, labeler.py)용 저장소. 태그 <테이블>.data → 테이블 <테이블>
[OUTPUT]
    Name          pgsql
    Match         audio.data
    Host          ${PSQL_HOST}
    Port          ${PSQL_PORT}
    User          ${PSQL_USER}
    Password      ${PSQL_PASS}
    Database      data
    Table         audio
    Timestamp_Key ts

[OUTPUT]
    Name          pgsql
    Match         tcpdump.data
    Host          ${PSQL_HOST}
    Port          ${PSQL_PORT}
    User          ${PSQL_USER}
    Password      ${PSQL_PASS}
    Database      data
    Table         tcpdump
    Timestamp_Key ts

[OUTPUT]
    Name          pgsql
    Match         opencv.data
    Host          ${PSQL_HOST}
    Port          ${PSQL_PORT}
    User          ${PSQL_USER}
    Password      ${PSQL_PASS}
    Database      data
    Table         opencv
    Timestamp_Key ts
