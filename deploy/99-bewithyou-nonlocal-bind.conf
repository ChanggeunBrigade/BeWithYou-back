# 부팅 시 Docker가 tailscaled보다 먼저 올라와 TAILSCALE_IP가 아직 없어도
# 그 주소로 포트를 바인딩할 수 있게 한다. 이게 없으면 docker-compose.yml에서
# TAILSCALE_IP에 바인딩한 PostgreSQL/Kafka/Mosquitto가 재부팅 후 시작되지 않는다.
# (restart: always는 바인딩 실패처럼 시작 자체가 실패한 컨테이너는 다시 띄우지 않는다)
#
# 설치: sudo cp deploy/99-bewithyou-nonlocal-bind.conf /etc/sysctl.d/ && sudo sysctl --system
net.ipv4.ip_nonlocal_bind = 1
